<svg viewBox="0 0 900 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="950" fill="#ffffff"/>

  <text x="450" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Figure 36.1: Fernbrook Ops Agent, Final Production Architecture</text>

  <!-- Main chain -->
  <rect x="250" y="35" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="61" text-anchor="middle" font-size="13" fill="#000000">Customer or Fernbrook Staff Member</text>

  <line x1="450" y1="77" x2="450" y2="98" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="100" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="126" text-anchor="middle" font-size="13" fill="#000000">Application Layer</text>

  <line x1="450" y1="142" x2="450" y2="163" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="165" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="191" text-anchor="middle" font-size="12.5" fill="#000000">AgentCore Identity (Cognito, verified actor_id)</text>

  <line x1="450" y1="207" x2="450" y2="228" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="230" width="400" height="70" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="450" y="257" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#000000">AgentCore Runtime</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#000000">Strands Agent + Claude (Guardrail-wrapped)</text>
  <text x="450" y="292" text-anchor="middle" font-size="10" fill="#000000">current_utc_time, get_order_status, get_wholesale_account_status, process_refund</text>

  <line x1="450" y1="300" x2="450" y2="321" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="323" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="349" text-anchor="middle" font-size="13" fill="#000000">AgentCore Memory (short-term only)</text>

  <line x1="450" y1="365" x2="450" y2="386" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="388" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="414" text-anchor="middle" font-size="13" fill="#000000">Bedrock Knowledge Base (Retrieve)</text>

  <line x1="450" y1="430" x2="450" y2="451" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="453" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="479" text-anchor="middle" font-size="13" fill="#000000">AgentCore Gateway (AWS_IAM / SigV4)</text>

  <line x1="450" y1="495" x2="450" y2="516" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="518" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="450" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">AgentCore Policy (Cedar, default-deny)</text>

  <line x1="450" y1="560" x2="450" y2="581" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="583" width="400" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="606" text-anchor="middle" font-size="12.5" fill="#000000">Order Lookup / Wholesale Lookup Lambdas</text>
  <text x="450" y="623" text-anchor="middle" font-size="11" fill="#000000">(ownership-checked wrappers, Design Note 23)</text>

  <line x1="450" y1="643" x2="450" y2="664" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="666" width="400" height="42" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="692" text-anchor="middle" font-size="12.5" fill="#000000">Fernbrook Data: DynamoDB, Secrets Manager</text>

  <!-- process_refund side path -->
  <line x1="250" y1="265" x2="130" y2="265" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="20" y="240" width="210" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="125" y="260" text-anchor="middle" font-size="11.5" fill="#000000">process_refund</text>
  <text x="125" y="275" text-anchor="middle" font-size="10" fill="#000000">(local tool, bypasses Gateway)</text>

  <line x1="125" y1="290" x2="125" y2="600" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="125" y1="600" x2="248" y2="600" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="20" y="575" width="210" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="125" y="595" text-anchor="middle" font-size="11" fill="#000000">Refund tables:</text>
  <text x="125" y="610" text-anchor="middle" font-size="10" fill="#000000">orders, approvals,</text>
  <text x="125" y="623" text-anchor="middle" font-size="10" fill="#000000">idempotency (TTL)</text>

  <line x1="125" y1="630" x2="125" y2="680" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="20" y="682" width="210" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="125" y="700" text-anchor="middle" font-size="11" fill="#000000">Human Approval</text>
  <text x="125" y="715" text-anchor="middle" font-size="10" fill="#000000">(refunds above $100)</text>

  <!-- Guardrails -->
  <rect x="680" y="230" width="190" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="775" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Guardrails</text>
  <text x="775" y="272" text-anchor="middle" font-size="10" fill="#000000">Content filters, PII,</text>
  <text x="775" y="286" text-anchor="middle" font-size="10" fill="#000000">grounding check</text>
  <line x1="678" y1="265" x2="653" y2="265" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Observability -->
  <rect x="680" y="323" width="190" height="343" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="775" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Observability</text>
  <text x="775" y="368" text-anchor="middle" font-size="10" fill="#000000">CloudWatch traces</text>
  <text x="775" y="382" text-anchor="middle" font-size="10" fill="#000000">(Ch. 24) and EMF</text>
  <text x="775" y="396" text-anchor="middle" font-size="10" fill="#000000">metrics (Ch. 25):</text>
  <text x="775" y="414" text-anchor="middle" font-size="9.5" fill="#000000">RefundEscalated</text>
  <text x="775" y="428" text-anchor="middle" font-size="9.5" fill="#000000">LookupOwnershipDenied</text>
  <text x="775" y="442" text-anchor="middle" font-size="9.5" fill="#000000">RefundIdempotentReplay</text>
  <text x="775" y="456" text-anchor="middle" font-size="9.5" fill="#000000">MemoryUnavailableDegraded</text>
  <line x1="678" y1="400" x2="653" y2="400" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="678" y1="540" x2="653" y2="540" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Ops Monitor Agent, separate, bottom -->
  <line x1="775" y1="666" x2="775" y2="740" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="600" y="742" width="270" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="735" y="765" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Ops Monitor Agent</text>
  <text x="735" y="782" text-anchor="middle" font-size="10.5" fill="#000000">Separate deployment, staff-only (Ch. 35).</text>
  <text x="735" y="797" text-anchor="middle" font-size="10.5" fill="#000000">Reads metrics only; no customer data path.</text>

  <!-- Caption -->
  <text x="450" y="860" text-anchor="middle" font-size="11.5" fill="#000000">Solid arrows: the customer request path. Dashed arrows: cross-cutting concerns and the refund tool's</text>
  <text x="450" y="878" text-anchor="middle" font-size="11.5" fill="#000000">separate path, which never passes through Gateway or Cedar Policy (Design Note 17).</text>
  <text x="450" y="905" text-anchor="middle" font-size="11" fill="#000000">The Ops Monitor Agent has no connection into this diagram's main flow at all, only into Observability,</text>
  <text x="450" y="922" text-anchor="middle" font-size="11" fill="#000000">the structural security boundary Design Note 35 argued for.</text>
</svg>
