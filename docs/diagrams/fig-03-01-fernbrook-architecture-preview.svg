<svg viewBox="0 0 800 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="950" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="18" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Figure 3.1: Fernbrook Ops Agent Target Production Architecture</text>

  <!-- Main chain boxes -->
  <!-- 1 -->
  <rect x="200" y="35" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#000000">Customer or Support Agent (User)</text>

  <line x1="400" y1="80" x2="400" y2="103" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="200" y="105" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-size="14" fill="#000000">Application Layer (Web / API)</text>

  <line x1="400" y1="150" x2="400" y2="173" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="200" y="175" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" font-size="14" fill="#000000">AgentCore Identity (inbound authentication)</text>

  <line x1="400" y1="220" x2="400" y2="243" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 (taller) -->
  <rect x="200" y="245" width="400" height="70" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="400" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">AgentCore Runtime</text>
  <text x="400" y="292" text-anchor="middle" font-size="13" fill="#000000">Strands Agent + Claude (Amazon Bedrock)</text>

  <line x1="400" y1="315" x2="400" y2="338" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="200" y="340" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="367" text-anchor="middle" font-size="14" fill="#000000">AgentCore Memory (short-term + long-term)</text>

  <line x1="400" y1="385" x2="400" y2="408" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 -->
  <rect x="200" y="410" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="437" text-anchor="middle" font-size="13.5" fill="#000000">Bedrock Knowledge Base (policies, product info)</text>

  <line x1="400" y1="455" x2="400" y2="478" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 -->
  <rect x="200" y="480" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="507" text-anchor="middle" font-size="14" fill="#000000">AgentCore Gateway</text>

  <line x1="400" y1="525" x2="400" y2="548" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 -->
  <rect x="200" y="550" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="400" y="577" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">AgentCore Policy (Cedar authorization)</text>

  <line x1="400" y1="595" x2="400" y2="618" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9 (taller, three tools) -->
  <rect x="200" y="620" width="400" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="647" text-anchor="middle" font-size="13.5" fill="#000000">Tools</text>
  <text x="400" y="667" text-anchor="middle" font-size="12.5" fill="#000000">Order Lookup · Wholesale Lookup · Refund (Lambda)</text>

  <line x1="400" y1="690" x2="400" y2="713" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 10 -->
  <rect x="200" y="715" width="400" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="742" text-anchor="middle" font-size="13.5" fill="#000000">Fernbrook Systems (synthetic order &amp; account data)</text>

  <!-- Human Approval side box -->
  <rect x="20" y="620" width="150" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="95" y="648" text-anchor="middle" font-size="12.5" fill="#000000">Human Approval</text>
  <text x="95" y="665" text-anchor="middle" font-size="11.5" fill="#000000">(sensitive actions)</text>
  <line x1="170" y1="655" x2="197" y2="655" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Observability side box -->
  <rect x="630" y="245" width="150" height="470" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="705" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">AgentCore</text>
  <text x="705" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Observability</text>
  <text x="705" y="308" text-anchor="middle" font-size="11" fill="#000000">Traces, logs, and</text>
  <text x="705" y="323" text-anchor="middle" font-size="11" fill="#000000">metrics via</text>
  <text x="705" y="338" text-anchor="middle" font-size="11" fill="#000000">CloudWatch and</text>
  <text x="705" y="353" text-anchor="middle" font-size="11" fill="#000000">OpenTelemetry</text>

  <line x1="628" y1="280" x2="603" y2="280" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="628" y1="502" x2="603" y2="502" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="628" y1="572" x2="603" y2="572" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="400" y="885" text-anchor="middle" font-size="11.5" fill="#000000">Built incrementally: Runtime and the Bedrock model arrive in a later design note; Memory in a later design note;</text>
  <text x="400" y="902" text-anchor="middle" font-size="11.5" fill="#000000">Gateway, Knowledge, and Tools in the earlier design notes; Identity, Policy, and Human Approval in a later design note.</text>
</svg>
